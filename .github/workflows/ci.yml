name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: CI validation
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion '5.7.1' -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion '1.25.0' -Repository PSGallery -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion '5.7.1' -Force
          Import-Module PSScriptAnalyzer -RequiredVersion '1.25.0' -Force
          $ValidationParameters = @{}
          if ($env:GITHUB_REF -like 'refs/tags/*') {
              $ValidationParameters.Tag = $env:GITHUB_REF.Substring('refs/tags/'.Length)
          }
          .\build\Invoke-Validation.ps1 @ValidationParameters
  powershell-validation:
    name: PowerShell validation
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report canonical validation result
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "::error::CI validation did not succeed ($VALIDATION_RESULT)."
            exit 1
          fi

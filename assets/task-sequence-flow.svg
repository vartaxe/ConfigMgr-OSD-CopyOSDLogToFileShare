<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc">
    <title id="title">ConfigMgr Task Sequence pattern</title>
    <desc id="desc">Set custom variables, run the packaged PowerShell script and capture its result, clear credential variables on success and failure, then report or propagate the saved result. Cleanup uses native Task Sequence steps.</desc>
    <style>
        svg { color-scheme: light dark; font-family: "Segoe UI", Arial, sans-serif; --surface: #f4f8fa; --card: #ffffff; --text: #243746; --muted: #526574; --accent: #117865; --on-accent: #ffffff; --border: #cbd9e1; }
        .canvas { fill: var(--surface); }
        .card { fill: var(--card); stroke: var(--border); stroke-width: 2; }
        text { fill: var(--text); }
        .muted { fill: var(--muted); }
        .badge, .arrowhead { fill: var(--accent); }
        .number { fill: var(--on-accent); font-size: 24px; font-weight: 700; text-anchor: middle; }
        .label { font-size: 26px; font-weight: 600; }
        .arrow { fill: none; stroke: var(--accent); stroke-width: 3; marker-end: url(#arrow); }
        @media (prefers-color-scheme: dark) {
            svg { --surface: #0d1520; --card: #152333; --text: #e5edf3; --muted: #b0c3d1; --accent: #70dec5; --on-accent: #103d38; --border: #385064; }
        }
    </style>
    <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path class="arrowhead" d="M0 0l8 4-8 4z"/>
        </marker>
    </defs>
    <rect class="canvas" width="1400" height="340" rx="24"/>
    <text x="40" y="54" font-size="32" font-weight="700">ConfigMgr Task Sequence pattern</text>
    <g>
        <rect class="card" x="40" y="106" width="304" height="120" rx="16"/>
        <circle class="badge" cx="76" cy="158" r="21"/>
        <text class="number" x="76" y="166">1</text>
        <text class="label" x="114" y="151">Set</text>
        <text class="label" x="114" y="187">variables</text>
    </g>
    <path class="arrow" d="M350 166h22"/>
    <g>
        <rect class="card" x="380" y="106" width="304" height="120" rx="16"/>
        <circle class="badge" cx="416" cy="158" r="21"/>
        <text class="number" x="416" y="166">2</text>
        <text class="label" x="454" y="151">Run packaged</text>
        <text class="label" x="454" y="187">script</text>
    </g>
    <path class="arrow" d="M690 166h22"/>
    <g>
        <rect class="card" x="720" y="106" width="304" height="120" rx="16"/>
        <circle class="badge" cx="756" cy="158" r="21"/>
        <text class="number" x="756" y="166">3</text>
        <text class="label" x="794" y="151">Clear variables</text>
        <text class="label" x="794" y="187">on every outcome</text>
    </g>
    <path class="arrow" d="M1030 166h22"/>
    <g>
        <rect class="card" x="1060" y="106" width="304" height="120" rx="16"/>
        <circle class="badge" cx="1096" cy="158" r="21"/>
        <text class="number" x="1096" y="166">4</text>
        <text class="label" x="1134" y="151">Report saved</text>
        <text class="label" x="1134" y="187">result</text>
    </g>
    <text class="muted" x="40" y="282" font-size="24">Capture the script result, clear credentials even on failure, then propagate that result.</text>
</svg>

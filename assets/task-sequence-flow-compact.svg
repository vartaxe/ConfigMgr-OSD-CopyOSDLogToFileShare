<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-labelledby="title desc">
    <title id="title">ConfigMgr Task Sequence pattern</title>
    <desc id="desc">Set custom variables, run the packaged PowerShell script and capture its result, clear credential variables on success and failure, then report or propagate the saved result. Cleanup uses native Task Sequence steps.</desc>
    <style>
        svg { color-scheme: light dark; font-family: "Segoe UI", Arial, sans-serif; --surface: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #334155; --accent: #0e7490; --on-accent: #ffffff; --border: #b9dce5; }
        .canvas { fill: var(--surface); }
        .card { fill: var(--card); stroke: var(--border); stroke-width: 2; }
        text { fill: var(--text); }
        .muted { fill: var(--muted); font-size: 18px; }
        .badge, .arrowhead { fill: var(--accent); }
        .number { fill: var(--on-accent); font-size: 24px; font-weight: 700; text-anchor: middle; }
        .label { font-size: 24px; font-weight: 600; }
        .arrow { fill: none; stroke: var(--accent); stroke-width: 3; marker-end: url(#arrow); }
        @media (prefers-color-scheme: dark) {
            svg { --surface: #0f172a; --card: #162238; --text: #f1f5f9; --muted: #cbd5e1; --accent: #67e8f9; --on-accent: #083344; --border: #276477; }
        }
    </style>
    <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path class="arrowhead" d="M0 0l8 4-8 4z"/>
        </marker>
    </defs>
    <rect class="canvas" width="440" height="660" rx="24"/>
    <text x="24" y="48" font-size="28" font-weight="700">ConfigMgr Task Sequence</text>
    <text x="24" y="92" font-size="28" font-weight="700">pattern</text>
    <g>
        <rect class="card" x="20" y="118" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="164" r="21"/>
        <text class="number" x="56" y="172">1</text>
        <text class="label" x="96" y="158">Set variables</text>
        <text class="muted" x="96" y="186">Hidden credentials</text>
    </g>
    <path class="arrow" d="M220 214v14"/>
    <g>
        <rect class="card" x="20" y="232" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="278" r="21"/>
        <text class="number" x="56" y="286">2</text>
        <text class="label" x="96" y="272">Run packaged script</text>
        <text class="muted" x="96" y="300">Capture its result.</text>
    </g>
    <path class="arrow" d="M220 328v14"/>
    <g>
        <rect class="card" x="20" y="346" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="392" r="21"/>
        <text class="number" x="56" y="400">3</text>
        <text class="label" x="96" y="386">Clear variables</text>
        <text class="muted" x="96" y="414">On success and failure</text>
    </g>
    <path class="arrow" d="M220 442v14"/>
    <g>
        <rect class="card" x="20" y="460" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="506" r="21"/>
        <text class="number" x="56" y="514">4</text>
        <text class="label" x="96" y="500">Report saved result</text>
        <text class="muted" x="96" y="528">Preserve success or failure.</text>
    </g>
    <text x="24" y="606" font-size="20">Clear credentials before final</text>
    <text x="24" y="636" font-size="20">failure propagation.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1010" viewBox="0 0 440 1010" role="img" aria-labelledby="title desc">
    <title id="title">Copy OSD Logs to File Share workflow</title>
    <desc id="desc">Set custom log variables, collect the standard log profile, write Manifest.json, create a local ZIP, check TCP 445, upload and verify remote byte size, then clear credentials with native Task Sequence steps. Cleanup must also run on failure. Extended logs are opt-in.</desc>
    <style>
        svg { color-scheme: light dark; font-family: "Segoe UI", Arial, sans-serif; --surface: #f4f8fa; --card: #ffffff; --text: #243746; --muted: #526574; --accent: #117865; --on-accent: #ffffff; --border: #cbd9e1; }
        .canvas { fill: var(--surface); }
        .card { fill: var(--card); stroke: var(--border); stroke-width: 2; }
        text { fill: var(--text); }
        .muted { fill: var(--muted); font-size: 18px; }
        .badge, .arrowhead { fill: var(--accent); }
        .number { fill: var(--on-accent); font-size: 24px; font-weight: 700; text-anchor: middle; }
        .label { font-size: 24px; font-weight: 600; }
        .arrow { fill: none; stroke: var(--accent); stroke-width: 3; marker-end: url(#arrow); }
        @media (prefers-color-scheme: dark) {
            svg { --surface: #0d1520; --card: #152333; --text: #e5edf3; --muted: #b0c3d1; --accent: #70dec5; --on-accent: #103d38; --border: #385064; }
        }
    </style>
    <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path class="arrowhead" d="M0 0l8 4-8 4z"/>
        </marker>
    </defs>
    <rect class="canvas" width="440" height="1010" rx="24"/>
    <text x="24" y="48" font-size="28" font-weight="700">Copy OSD Logs</text>
    <text x="24" y="92" font-size="28" font-weight="700">to a file share</text>
    <g>
        <rect class="card" x="20" y="126" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="172" r="21"/>
        <text class="number" x="56" y="180">1</text>
        <text class="label" x="96" y="166">Set log variables</text>
        <text class="muted" x="96" y="194">Hidden password</text>
    </g>
    <path class="arrow" d="M220 222v12"/>
    <g>
        <rect class="card" x="20" y="238" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="284" r="21"/>
        <text class="number" x="56" y="292">2</text>
        <text class="label" x="96" y="278">Collect standard logs</text>
        <text class="muted" x="96" y="306">Extended logs are opt-in.</text>
    </g>
    <path class="arrow" d="M220 334v12"/>
    <g>
        <rect class="card" x="20" y="350" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="396" r="21"/>
        <text class="number" x="56" y="404">3</text>
        <text class="label" x="96" y="390">Write Manifest.json</text>
        <text class="muted" x="96" y="418">Record collection results.</text>
    </g>
    <path class="arrow" d="M220 446v12"/>
    <g>
        <rect class="card" x="20" y="462" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="508" r="21"/>
        <text class="number" x="56" y="516">4</text>
        <text class="label" x="96" y="502">Create local ZIP</text>
        <text class="muted" x="96" y="530">Keep a local archive.</text>
    </g>
    <path class="arrow" d="M220 558v12"/>
    <g>
        <rect class="card" x="20" y="574" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="620" r="21"/>
        <text class="number" x="56" y="628">5</text>
        <text class="label" x="96" y="614">TCP 445 preflight</text>
        <text class="muted" x="96" y="642">Before each upload attempt</text>
    </g>
    <path class="arrow" d="M220 670v12"/>
    <g>
        <rect class="card" x="20" y="686" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="732" r="21"/>
        <text class="number" x="56" y="740">6</text>
        <text class="label" x="96" y="726">Upload and verify</text>
        <text class="muted" x="96" y="754">Compare remote byte size.</text>
    </g>
    <path class="arrow" d="M220 782v12"/>
    <g>
        <rect class="card" x="20" y="798" width="400" height="92" rx="16"/>
        <circle class="badge" cx="56" cy="844" r="21"/>
        <text class="number" x="56" y="852">7</text>
        <text class="label" x="96" y="838">Clear variables</text>
        <text class="muted" x="96" y="866">Native credential cleanup</text>
    </g>
    <text x="24" y="940" font-size="20">Native cleanup runs on success</text>
    <text x="24" y="970" font-size="20">and failure; preserve the result.</text>
</svg>

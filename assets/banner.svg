<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
    <title id="title">Copy OSD Logs to File Share</title>
    <desc id="desc">Collect, archive, upload, and verify deployment logs using Windows PowerShell 5.1 in a ConfigMgr Task Sequence. MIT-licensed utility; live validation remains pending.</desc>
    <style>
        svg { color-scheme: light dark; font-family: "Segoe UI", Arial, sans-serif; }
        .start { stop-color: #075985; }
        .end { stop-color: #3730a3; }
        .badge { fill: #164e63; }
        text { fill: #ffffff; }
        @media (prefers-color-scheme: dark) {
            .start { stop-color: #083344; }
            .end { stop-color: #312e81; }
            .badge { fill: #083344; }
        }
    </style>
    <defs>
        <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
            <stop class="start" offset="0"/>
            <stop class="end" offset="1"/>
        </linearGradient>
        <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity=".24"/>
        </filter>
    </defs>
    <rect width="1280" height="360" rx="34" fill="url(#background)"/>
    <circle cx="1120" cy="80" r="190" fill="#ffffff" fill-opacity=".05"/>
    <circle cx="1040" cy="310" r="150" fill="#ffffff" fill-opacity=".04"/>
    <g filter="url(#shadow)">
        <rect x="112" y="81" width="84" height="72" rx="10" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".65" stroke-width="3"/>
        <path d="M128 105h52M128 124h43M128 143h31" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        <path d="M196 83l22 22v48c0 8-6 14-14 14h-46" fill="none" stroke="#ffffff" stroke-opacity=".65" stroke-width="3"/>
    </g>
    <text x="250" y="145" font-size="52" font-weight="700">Copy OSD Logs to File Share</text>
    <text x="252" y="205" font-size="26">Collect, zip, upload, and verify deployment logs</text>
    <g transform="translate(252 242)">
        <rect class="badge" width="238" height="40" rx="20"/>
        <text x="119" y="27" text-anchor="middle" font-size="18">Windows PowerShell 5.1</text>
        <rect class="badge" x="254" width="244" height="40" rx="20"/>
        <text x="376" y="27" text-anchor="middle" font-size="18">ConfigMgr Task Sequence</text>
        <rect class="badge" x="514" width="154" height="40" rx="20"/>
        <text x="591" y="27" text-anchor="middle" font-size="18">MIT Licensed</text>
    </g>
</svg>
